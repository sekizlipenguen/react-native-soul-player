def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

buildscript {
    if (project == rootProject) {
        repositories {
            google()
            mavenCentral()
        }
        dependencies {
            classpath("com.android.tools.build:gradle:8.7.2")
        }
    }
}

apply plugin: 'com.android.library'

android {
    namespace "com.sekizlipenguen.soulplayer"

    compileSdkVersion safeExtGet('compileSdkVersion', 36).toInteger()

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 24)
        targetSdkVersion safeExtGet('targetSdkVersion', 36)
        buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", (safeExtGet("newArchEnabled", false).toString() == "true").toString()
    }

    buildFeatures {
        buildConfig true
    }

    lintOptions {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    mavenCentral()
    google()
    maven { url "https://www.jitpack.io" }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.mediarouter:mediarouter:1.7.0'
    implementation 'com.google.android.gms:play-services-cast-framework:21.5.0'

    //noinspection GradleDynamicVersion
    implementation "com.facebook.react:react-android"
}
